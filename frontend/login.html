<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 1rem; }
        .login-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
        .login-card h2 { margin-bottom: 0.5rem; background: linear-gradient(135deg, #00d9ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; }
        .login-card p { color: #b0b0d0; font-size: 0.85rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.8rem; color: #b0b0d0; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.5rem; color: white; font-size: 0.95rem; }
        input:focus, select:focus { outline: none; border-color: #00d9ff; }
        select option { background: #1a1a1a; color: white; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #00d9ff, #a855f7); color: #0f0f0f; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; margin-top: 1rem; font-size: 1rem; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; }
        .redirect-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #b0b0d0; }
        .redirect-link a { color: #00d9ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Sign in to access CampusConnect portal</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label>Select Role</label>
                <select id="loginRole">
                    <option value="student">Student</option>
                    <option value="organizer">Organizer</option>
                    <option value="admin">Admin / Super Admin</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">LOGIN</button>
        </form>

        <div class="redirect-link">
            Don't have an account? <a href="/register.html">Register here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('campusConnectUser', JSON.stringify(data));
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.error || "Login failed");
                }
            } catch (err) {
                alert("Network error. Please try again.");
            }
        });
    </script>
</body>
</html>
